[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-chess-tutor-api"
version = "0.1.0"
description = "Local-first API for AI chess tutoring."
requires-python = ">=3.8"
dependencies = [
  "fastapi>=0.110,<0.116",
  "uvicorn>=0.29,<0.35",
  "pydantic>=2.6,<2.11",
  "python-chess>=1.999",
  "httpx>=0.27,<0.29"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
